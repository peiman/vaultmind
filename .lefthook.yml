# .lefthook.yml
#
# ============================================================================
# OWNERSHIP MODEL (Framework Separation)
# ============================================================================
#
# This file EXTENDS the framework's base hooks configuration.
# Framework hooks are in: .ckeletin/configs/lefthook.base.yml
#
# FRAMEWORK-MANAGED (via extends):
#   - Standard quality checks (format, lint, test, secrets, vuln)
#   - Pre-commit and pre-push hook structure
#
# PROJECT CUSTOMIZATION:
#   - Add project-specific hooks below the extends
#   - Override framework hooks by redefining them here
#   - Add new hook types (e.g., commit-msg)
#
# When running `task ckeletin:update`:
# - Framework hooks (.ckeletin/configs/lefthook.base.yml) are automatically updated
# - This file is NOT updated (project customizations preserved)
#
# Use `lefthook dump` to see the merged configuration.
#
# ============================================================================

# Extend framework base hooks
extends:
  - .ckeletin/configs/lefthook.base.yml

# Project-specific hooks (add below)

# Override: pre-commit ran the whole unit suite and pre-push ran it again under
# coverage — a commit plus a push took up to ten minutes on a loaded machine
# (#185). Pre-commit now tests only the packages that own the staged files
# (.claude/scripts/test-staged.sh); pre-push keeps the full coverage run, the
# authoritative gate before anything leaves the machine.
#
# A new command rather than a replacement `run:` for the base's `test`: when
# both files set the same key, lefthook 1.7 keeps the extended base's value, so
# the base `test` is skipped (skip merges) and this runs instead.
#
# No {staged_files}: lefthook leaves out deleted files and the old side of a
# rename, so the script reads the staged set from git itself.
pre-commit:
  commands:
    test:
      skip: true
    test-staged:
      run: task test:staged

commit-msg:
  commands:
    # The `!` before the colon is the breaking-change marker the Conventional
    # Commits spec defines (<type>[optional scope][!]: <description>). The regex
    # used to omit it, so `fix(cli)!:` was REJECTED and a breaking change could
    # only be signalled in a footer — which is where breaking changes get buried.
    # A format that refuses its own way of shouting is fighting itself.
    conventional-commit:
      run: |
        MSG=$(head -1 {1})
        if ! echo "$MSG" | grep -qE '^(feat|fix|docs|test|refactor|style|perf|build|ci|chore)(\(.+\))?!?: .+'; then
          echo "❌ Commit message must follow Conventional Commits format:"
          echo "   <type>[optional scope][!]: <description>"
          echo ""
          echo "   Types: feat, fix, docs, test, refactor, style, perf, build, ci, chore"
          echo "   Append ! before the colon for a breaking change (fix(cli)!: ...),"
          echo "   and/or add a BREAKING CHANGE: footer."
          echo "   Your message: $MSG"
          exit 1
        fi
